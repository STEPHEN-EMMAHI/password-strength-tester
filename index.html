<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="A project to learn how to build a password-strength-tester"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/view/style.css" />
    <link rel="icon" href="favicon-32x32.png" type="img/png" />
    <title>password-strength-tester</title>
  </head>

  <body>
    <div class="h-screen flex flex-col justify-center md:items-center">
      <!-- HEADER -->
      <header class="w-full text-center">
        <h1 class="text-2xl font-bold">Create Account</h1>
        <p>Sign up to access all features and get started</p>
      </header>

      <!-- MAIN -->
      <main class="mx-4 mt-4 md:mx-0">
        <form action="https://stephen-emmahi-nartey/bin" method="post">
          <!-- email -->
          <div class="email-group mb-2">
            <label for="email" class="mb-2 block">Email</label>
            <input
              class="border rounded-lg outline-none block p-2 w-full"
              type="email"
              name="email"
              id="email"
              placeholder="name@gmail.com"
            />
          </div>
          <!-- password -->
          <div class="password-group mb-2">
            <label for="password" class="mb-2 block">Password</label>
            <div class="relative">
              <input
                class="border rounded-lg outline-none p-2 w-full"
                type="password"
                name="password"
                id="password"
                placeholder="********"
                autocomplete="new-password"
              />
              <button
                id="showHidePasswordBtn"
                type="button"
                class="absolute text-sm right-3 top-2.5 -translate-y-0.5"
              >
                show
              </button>
            </div>
            <div class="strength-container flex items-center gap-4 p-2">
              <!-- progress bar track -->
              <div
                class="strength-track w-full h-1 bg-[#e5e7eb] rounded-full overflow-hidden"
                role="progressbar"
                id="strength-bar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                aria-label="Password-strength"
              >
                <!-- active fill bar -->
                <div
                  class="strength-fill h-full transition-all duration-300 ease-in-out"
                  id="strength-fill"
                ></div>
              </div>
              <span class="strength-label" id="strength-label"></span>
            </div>
            <div id="password-rules" class="hidden text-red-500">
              <p id="samePasswordAndEmail" class="hidden">
                Password cannot be same as email
              </p>
            </div>
            <!-- confirm password -->
            <label for="password" class="mt-2 mb-2 block"
              >Confirm Password</label
            >
            <div class="relative">
              <input
                class="border rounded-lg outline-none p-2 w-full"
                type="password"
                name="confirmPassword"
                id="confirmPassword"
                placeholder="********"
                autocomplete="new-password"
              />
              <button
                id="showOrHideConfirmPasswordBtn"
                type="button"
                class="absolute text-sm right-3 top-2.5 -translate-y-0.5"
              >
                show
              </button>
            </div>
            <p id="confirmPasswordWarning" class="text-red-500 mt-1 hidden">
              Password mismatch
            </p>
          </div>
          <!-- checkbox -->
          <input
            type="checkbox"
            id="checkbox"
            name="checkbox"
            class="size-4 mt-3"
          />
          <label for="checkbox" class="text-sm"
            >I agree to the
            <a href="#" class="underline">Terms and Conditions.</a>
          </label>
          <!-- submit button -->
          <button
            id="submitBtn"
            class="m-4 block border mx-auto p-2 w-full text-white"
            type="submit"
            disabled
          >
            Submit
          </button>
        </form>
      </main>
    </div>
    <script type="module" src="./src/controller/main.js"></script>
  </body>
</html>
